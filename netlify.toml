[build]
  command = "node scripts/build.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# non-www → www 301 리디렉션 (canonical과 일치시키기 위해)
[[redirects]]
  from = "https://babyfairschedule.co.kr/*"
  to   = "https://www.babyfairschedule.co.kr/:splat"
  status = 301
  force  = true

