name: 일정 빌드

# 매일 새벽 4시(KST)에 다시 빌드합니다.
# 정적 사이트라도 D-day, "진행 중", "종료" 상태가 매일 자동으로 갱신됩니다.
on:
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "templates/**"
      - "scripts/build.mjs"
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = KST 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 빌드
        run: node scripts/build.mjs

      - name: 변경사항 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml event/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 일정 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
